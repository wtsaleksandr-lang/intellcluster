<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    *{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px}a{color:#202123;text-decoration:none}a:hover{text-decoration:none}
    .topline{height:4px;background:#202123}.nav{height:62px;display:flex;align-items:center;max-width:1100px;margin:auto;padding:0 18px;gap:22px}.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:750;font-size:21px;letter-spacing:-.5px}.brand-mark{width:34px;height:34px;display:grid;place-items:center;color:var(--ink);flex:0 0 auto}.brand-mark svg{width:32px;height:32px;fill:none;stroke:#202123;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}.brand:hover .brand-mark svg{stroke:#000}
    .nav-search{flex:1;max-width:390px;position:relative}.nav-search input,.hero-search input{width:100%;border:1px solid #d8d8dc;border-radius:10px;outline:none;color:#2f3033;background:#fff;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}.nav-search input{height:38px;padding:0 44px 0 16px}.nav-search input:hover,.nav-search input:focus{border-color:#9b9ba1;box-shadow:0 5px 18px rgba(0,0,0,.07)}.search-btn{position:absolute;right:5px;top:5px;width:28px;height:28px;border:0;border-radius:7px;background:#202123;color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .18s ease,background .18s ease}.search-btn:hover{transform:scale(1.05);background:#343541}.search-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
    .nav-links{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:12px}.grid-btn{font-size:18px;color:#444654}.account-btn{border:1px solid #d5d5d8;color:#343541;border-radius:8px;padding:9px 15px;background:#fff;transition:.18s ease}.account-btn:hover{background:#f7f7f8;border-color:#a9a9ad;box-shadow:0 4px 12px rgba(0,0,0,.05)}
    .page{max-width:1030px;margin:0 auto;padding:0 18px 60px}.wide{max-width:1110px}.subnav{height:45px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:30px;margin-bottom:14px}.subnav a{color:#777982;padding:0 8px 12px;font-size:12px}.subnav a.active{color:#202123;font-weight:700;border-bottom:2px solid #202123}.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.filter{height:38px;border:1px solid #d8d8dc;border-radius:8px;background:#fff;color:#444654;padding:0 34px 0 12px;min-width:120px;transition:.16s ease}.filter:hover,.filter:focus{border-color:#a9a9ad;box-shadow:0 3px 10px rgba(0,0,0,.05)}.filters .advanced{margin-left:auto;font-weight:700;color:#202123}

    .notice{font-size:11px;background:#f8f8f6;border:1px solid #deded6;padding:9px 12px;border-radius:7px;color:#68675f;margin:10px 0 14px}.profile-box{border:1px solid #dedee1;border-radius:10px;margin-top:10px;background:#fff;overflow:hidden}.profile-head{display:flex;justify-content:space-between;gap:20px;padding:17px 18px 12px;border-bottom:1px solid var(--line)}.profile-title{font-size:25px;color:#202123;font-weight:800;letter-spacing:-.7px}.profile-meta{padding:12px 18px 14px;line-height:1.7;font-size:11px}.profile-actions{display:flex;gap:8px;align-items:flex-start}.small-btn{border:1px solid #d8d8dc;background:#fff;border-radius:7px;padding:8px 11px;color:#565861}.source-line{border-top:1px solid var(--line);padding:10px 18px;color:#85858c;font-size:9px}.metric-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:17px 0}.metric{border:1px solid #dedee1;border-radius:9px;padding:12px 13px;background:#fff}.metric-label{font-size:9px;color:#85858c}.metric-value{font-size:15px;color:#202123;margin-top:4px;font-weight:700}
    .section{margin:24px 0}.section h2{font-size:18px;color:#202123;margin:0 0 13px}.data-table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #dedee1;border-radius:8px;overflow:hidden;font-size:11px}.data-table th{background:#f7f7f8;color:#74747b;text-align:left;font-size:9px;padding:9px;border-bottom:1px solid #e3e3e5}.data-table td{padding:10px 9px;border-bottom:1px solid #ececee;vertical-align:top}.data-table tr:nth-child(even) td{background:#fafafa}.data-table tr:last-child td{border-bottom:0}.barlist{display:flex;flex-direction:column;gap:9px}.barrow{display:grid;grid-template-columns:220px 1fr 55px;gap:12px;align-items:center;font-size:11px}.bar{height:14px;background:#eeeeef;border-radius:3px;overflow:hidden}.bar>span{display:block;height:100%;background:#343541}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#f5f5f6;border:1px solid #dedee1;color:#4c4d55;padding:5px 8px;border-radius:9px;font-size:10px}

    @media(max-width:760px){.nav-links a:not(.account-btn),.grid-btn{display:none}.nav{gap:10px}.brand{font-size:17px}.brand-mark{width:30px;height:30px}.brand-mark svg{width:28px;height:28px}.nav-search{max-width:none}.page{padding-left:10px;padding-right:10px}.metric-grid{grid-template-columns:repeat(2,1fr)}.filters .advanced{margin-left:0}.stats-row{flex-wrap:wrap;gap:8px}.mini-stat{border:0}.profile-head{flex-direction:column}.barrow{grid-template-columns:120px 1fr 40px}.feature-grid{grid-template-columns:repeat(2,1fr);width:min(430px,92vw)}.feature{min-height:118px}.subnav{gap:8px;overflow:auto}.profile-title{font-size:21px}.hero-logo{font-size:30px}.cluster-logo{width:58px;height:58px}.cluster-logo svg{width:45px;height:45px}.trade-map-svg{min-height:300px}.trade-map-total{font-size:13px}.trade-map-head{align-items:flex-start;flex-direction:column}}

  </style>
</head>

{% block nav %}

  <a class="brand" href="/data"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><g><ellipse cx="24" cy="10" rx="8" ry="3.4"/><path d="M16 10v17c0 1.9 3.6 3.4 8 3.4s8-1.5 8-3.4V10"/><path d="M16 18c0 1.9 3.6 3.4 8 3.4s8-1.5 8-3.4"/></g><g><ellipse cx="12" cy="20" rx="8" ry="3.4"/><path d="M4 20v17c0 1.9 3.6 3.4 8 3.4s8-1.5 8-3.4V20"/><path d="M4 28c0 1.9 3.6 3.4 8 3.4s8-1.5 8-3.4"/></g><g><ellipse cx="36" cy="20" rx="8" ry="3.4"/><path d="M28 20v17c0 1.9 3.6 3.4 8 3.4s8-1.5 8-3.4V20"/><path d="M28 28c0 1.9 3.6 3.4 8 3.4s8-1.5 8-3.4"/></g></svg></span><span>IntellCluster</span></a>

  <nav class="nav-links"><a href="/about">About</a><a href="/contact">Contact</a><span class="grid-btn">▦</span><a class="account-btn" href="/account">My Account⌄</a></nav>
</header>
{% endblock %}
{% block body %}{% endblock %}
<div class="trade-map-tip" id="tradeMapTip"></div>
<script>
(()=>{
  const countryCoords={

  const locate=(name,country)=>{const n=norm(name);for(const [key,v] of Object.entries(portCoords)){if(n.includes(key)||key.includes(n)&&n.length>4)return v;}return countryCoords[country]||countryCoords[String(country||'').trim()]||null};
  const project=([lon,lat])=>[(lon+180)/360*1000,(90-lat)/180*500];
  const land=`<g aria-hidden="true"><path class="trade-map-land americas" d="M65 94 L105 58 175 50 225 72 245 110 220 145 190 158 176 205 152 240 130 232 115 190 93 168 78 134Z"/><path class="trade-map-land americas" d="M230 260 L278 248 315 280 330 334 312 386 284 444 261 430 247 371 225 323Z"/><path class="trade-map-land europe" d="M455 98 L493 74 552 82 573 113 548 136 504 139 472 128Z"/><path class="trade-map-land africa" d="M486 164 L548 149 596 177 607 229 582 291 548 341 510 321 491 265 473 212Z"/><path class="trade-map-land asia" d="M563 91 L632 54 725 48 835 76 906 116 917 164 878 188 815 171 768 197 702 183 666 157 611 153 580 130Z"/><path class="trade-map-land oceania" d="M807 331 L856 310 905 331 916 371 889 404 842 394 815 366Z"/><path class="trade-map-land oceania" d="M945 413 L961 402 974 424 961 449Z"/></g>`;
  function shell(title,subtitle){const s=document.createElement('section');s.className='trade-map-section';s.innerHTML=`<div class="trade-map-head"><div><h2>${title}</h2><small>${subtitle}</small></div><div class="trade-map-controls"><button class="trade-map-control active" type="button">Shipments / activity</button></div></div><div class="trade-map-shell"><svg class="trade-map-svg" viewBox="0 0 1000 500" role="img" aria-label="Interactive geographic trade distribution map"><g class="grid"></g>${land}<g class="routes"></g><g class="points"></g></svg><div class="trade-map-legend">Bubble size = relative activity · hover for details · click to drill down</div><div class="trade-map-total"></div></div>`;return s;}
  const tip=document.getElementById('tradeMapTip');
  function bindTip(el,html,href){el.addEventListener('mouseenter',e=>{tip.innerHTML=html;tip.style.display='block';move(e)});el.addEventListener('mousemove',move);el.addEventListener('mouseleave',()=>tip.style.display='none');if(href){el.style.cursor='pointer';el.addEventListener('click',()=>location.href=href)}}
  function move(e){tip.style.left=Math.min(innerWidth-280,e.clientX+12)+'px';tip.style.top=Math.max(8,e.clientY-58)+'px'}
  function draw(section,points,routes,total,label){const svg=section.querySelector('svg'),grid=svg.querySelector('.grid'),rg=svg.querySelector('.routes'),pg=svg.querySelector('.points');for(let x=100;x<1000;x+=100)grid.insertAdjacentHTML('beforeend',`<line class="trade-map-grid" x1="${x}" y1="0" x2="${x}" y2="500"/>`);for(let y=100;y<500;y+=100)grid.insertAdjacentHTML('beforeend',`<line class="trade-map-grid" x1="0" y1="${y}" x2="1000" y2="${y}"/>`);
    routes.forEach(r=>{if(!r.a||!r.b)return;const [x1,y1]=project(r.a),[x2,y2]=project(r.b),cx=(x1+x2)/2,cy=Math.min(y1,y2)-Math.min(75,Math.abs(x2-x1)*.08);const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('class','trade-map-route');p.setAttribute('d',`M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`);rg.appendChild(p);bindTip(p,`<strong>${r.name}</strong>${Number(r.value||0).toLocaleString()} ${label}`)});
    const max=Math.max(...points.map(p=>p.value||0),1);points.forEach(p=>{if(!p.coord)return;const [x,y]=project(p.coord),rad=4+Math.sqrt((p.value||1)/max)*18,g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class',`trade-map-dot ${p.kind||''}`);g.innerHTML=`<circle class="halo" cx="${x}" cy="${y}" r="${rad}"/><circle class="core" cx="${x}" cy="${y}" r="3.3"/><text class="trade-map-label" x="${x+6}" y="${y-6}">${String(p.name).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</text>`;pg.appendChild(g);bindTip(g,`<strong>${p.name}</strong>${p.country?`Country: ${p.country}<br>`:''}${Number(p.value||0).toLocaleString()} ${label}<em>Click for related intelligence</em>`,p.href)});section.querySelector('.trade-map-total').textContent=`${Number(total||0).toLocaleString()} ${label} in total`;}
  function companyMap(){const data=document.getElementById('iy-profile');if(!data)return false;let iy={};try{iy=JSON.parse(data.textContent||'{}')}catch{return false}const lanes=Array.isArray(iy.lane_permutations)?iy.lane_permutations:[];if(!lanes.length)return false;const points=new Map(),routes=[];let total=0;const add=(name,country,value,kind,href)=>{const coord=locate(name,country);if(!coord)return;const key=`${name}|${country}|${kind}`,old=points.get(key)||{name:name||country,country,coord,value:0,kind,href};old.value+=value;points.set(key,old)};lanes.slice(0,80).forEach(l=>{const v=Number(l.shipments||l.total_shipments||0);if(!v)return;total+=v;const a=locate(l.exit_port,l.exit_port_country),b=locate(l.entry_port,l.entry_port_country||'United States');add(l.exit_port||l.exit_port_country,l.exit_port_country,v,'origin',`/data/origin/${encodeURIComponent(l.exit_port_country||'')}`);add(l.entry_port||l.entry_port_country,l.entry_port_country||'United States',v,'destination',`/data/search?q=${encodeURIComponent(l.entry_port||'')}`);if(a&&b)routes.push({a,b,value:v,name:`${l.exit_port||l.exit_port_country} → ${l.entry_port||l.entry_port_country}`})});if(!points.size)return false;const sec=shell(`${iy.title||'Company'} Geographic Distribution by Trade Activity`,'Interactive origin, destination and trade-lane view from cached shipment intelligence.');const geography=document.getElementById('geography');if(geography)geography.insertAdjacentElement('beforebegin',sec);else document.querySelector('.trade-wrap')?.insertAdjacentElement('afterend',sec);draw(sec,[...points.values()],routes,total,'shipments');return true}
  function hsMap(){const hsShell=document.querySelector('.hs-shell');if(!hsShell)return false;const title=document.querySelector('.hs-title')?.textContent?.trim()||'HS Code';const rows=[...document.querySelectorAll('.origin-row')];if(!rows.length)return false;const pts=[];let total=0;rows.forEach(r=>{const a=r.querySelector('a'),country=a?.textContent?.trim(),pct=parseFloat(r.querySelector('.origin-val')?.textContent)||0,coord=locate('',country);if(!country||!coord)return;const value=Math.max(.1,pct);total+=value;pts.push({name:country,country,coord,value,kind:'origin',href:a.href})});const destinations=new Map();document.querySelectorAll('.company-table tbody tr').forEach(tr=>{const text=tr.cells?.[1]?.textContent||'';const country=text.includes('🇺🇸')?'United States':text.includes('🇨🇦')?'Canada':'';if(country)destinations.set(country,(destinations.get(country)||0)+1)});destinations.forEach((v,country)=>pts.push({name:country,country,coord:locate('',country),value:v,kind:'destination',href:`/data/search?country=${country==='Canada'?'CA':'US'}&hs=${encodeURIComponent(title.replace(/\D/g,''))}`}));const sec=shell(`${title} Geographic Distribution`,'Interactive sourcing geography from indexed HS relationships. Canadian public-data views show relationship share rather than fabricated shipment counts.');const child=document.querySelector('.child-panel')||document.querySelector('.hierarchy-panel')||document.querySelector('.hs-kpis');child?.insertAdjacentElement('afterend',sec);draw(sec,pts,[],100,'relationship share %');return true}
  companyMap()||hsMap();
})();
</script>
