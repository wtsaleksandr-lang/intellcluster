<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}IntellCluster Data{% endblock %}</title>
  <meta name="description" content="{% block meta_desc %}Search public business intelligence across companies, imports and government datasets.{% endblock %}">
  <style>
    :root {
      --ink:#202123; --ink2:#2f3033; --cyan:#202123; --cyan2:#444654;
      --text:#2f3033; --muted:#777982; --line:#e2e2e5; --soft:#f7f7f8;
      --white:#fff; --gold:#9b8b43; --green:#5f7468;
      --panel:#ffffff; --panel-hover:#fafafa; --shadow:0 14px 38px rgba(0,0,0,.10);
      --radius:10px;
    }
    *{box-sizing:border-box} html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px}
    a{color:#202123;text-decoration:none} a:hover{text-decoration:none}
    .topline{height:4px;background:#202123}.nav{height:62px;display:flex;align-items:center;max-width:1100px;margin:auto;padding:0 18px;gap:22px}
    .brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:750;font-size:21px;letter-spacing:-.5px}.brand-mark{width:30px;height:30px;border:2px solid var(--ink);border-radius:9px;display:grid;place-items:center;font-size:11px;color:var(--ink)}
    .nav-search{flex:1;max-width:390px;position:relative}.nav-search input,.hero-search input{width:100%;border:1px solid #d8d8dc;border-radius:10px;outline:none;color:#2f3033;background:#fff;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}.nav-search input{height:38px;padding:0 44px 0 16px}.nav-search input:hover,.nav-search input:focus{border-color:#9b9ba1;box-shadow:0 5px 18px rgba(0,0,0,.07)}
    .search-btn{position:absolute;right:5px;top:5px;width:28px;height:28px;border:0;border-radius:7px;background:#202123;color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .18s ease,background .18s ease}.search-btn:hover{transform:scale(1.05);background:#343541}.search-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
    .nav-links{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:12px}.grid-btn{font-size:18px;color:#444654}.account-btn{border:1px solid #d5d5d8;color:#343541;border-radius:8px;padding:9px 15px;background:#fff;transition:.18s ease}.account-btn:hover{background:#f7f7f8;border-color:#a9a9ad;box-shadow:0 4px 12px rgba(0,0,0,.05)}
    .page{max-width:1030px;margin:0 auto;padding:0 18px 60px}.wide{max-width:1110px}.subnav{height:45px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:30px;margin-bottom:14px}.subnav a{color:#777982;padding:0 8px 12px;font-size:12px}.subnav a.active{color:#202123;font-weight:700;border-bottom:2px solid #202123}
    .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.filter{height:38px;border:1px solid #d8d8dc;border-radius:8px;background:#fff;color:#444654;padding:0 34px 0 12px;min-width:120px;transition:.16s ease}.filter:hover,.filter:focus{border-color:#a9a9ad;box-shadow:0 3px 10px rgba(0,0,0,.05)}.filters .advanced{margin-left:auto;font-weight:700;color:#202123}
    .result-meta{color:#8a8a91;font-size:11px;margin:12px 0}.cards{display:flex;flex-direction:column;gap:10px}.card{border:1px solid #dedee1;border-radius:9px;background:#fff;display:flex;overflow:hidden;min-height:94px;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}.card:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.07);border-color:#c3c3c8}.card-accent{width:6px;background:#343541}.card.supplier .card-accent{background:#777982}.card-body{padding:12px 14px;flex:1}.card-title{font-size:16px;font-weight:700;color:#202123;margin-bottom:7px;display:flex;align-items:center;gap:8px}.badge{font-size:9px;font-weight:700;border-radius:9px;background:#343541;color:#fff;padding:3px 7px}.badge.dark{background:#606067}.badge.green{background:#666e68}.card-address{font-size:11px;color:#565861;margin-bottom:9px}.stats-row{display:flex;gap:0}.mini-stat{min-width:115px;padding-right:18px;margin-right:18px;border-right:1px solid #e4e4e7}.mini-stat:last-child{border-right:0}.mini-label{font-size:9px;color:#8a8a91;margin-bottom:3px}.mini-value{font-size:11px;color:#2f3033;font-weight:600}
    .notice{font-size:11px;background:#f8f8f6;border:1px solid #deded6;padding:9px 12px;border-radius:7px;color:#68675f;margin:10px 0 14px}
    .profile-box{border:1px solid #dedee1;border-radius:10px;margin-top:10px;background:#fff;overflow:hidden}.profile-head{display:flex;justify-content:space-between;gap:20px;padding:17px 18px 12px;border-bottom:1px solid var(--line)}.profile-title{font-size:25px;color:#202123;font-weight:800;letter-spacing:-.7px}.profile-meta{padding:12px 18px 14px;line-height:1.7;font-size:11px}.profile-actions{display:flex;gap:8px;align-items:flex-start}.small-btn{border:1px solid #d8d8dc;background:#fff;border-radius:7px;padding:8px 11px;color:#565861}.source-line{border-top:1px solid var(--line);padding:10px 18px;color:#85858c;font-size:9px}
    .metric-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:17px 0}.metric{border:1px solid #dedee1;border-radius:9px;padding:12px 13px;background:#fff}.metric-label{font-size:9px;color:#85858c}.metric-value{font-size:15px;color:#202123;margin-top:4px;font-weight:700}
    .section{margin:24px 0}.section h2{font-size:18px;color:#202123;margin:0 0 13px}.data-table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #dedee1;border-radius:8px;overflow:hidden;font-size:11px}.data-table th{background:#f7f7f8;color:#74747b;text-align:left;font-size:9px;padding:9px;border-bottom:1px solid #e3e3e5}.data-table td{padding:10px 9px;border-bottom:1px solid #ececee;vertical-align:top}.data-table tr:nth-child(even) td{background:#fafafa}.data-table tr:last-child td{border-bottom:0}
    .barlist{display:flex;flex-direction:column;gap:9px}.barrow{display:grid;grid-template-columns:220px 1fr 55px;gap:12px;align-items:center;font-size:11px}.bar{height:14px;background:#eeeeef;border-radius:3px;overflow:hidden}.bar > span{display:block;height:100%;background:#343541}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#f5f5f6;border:1px solid #dedee1;color:#4c4d55;padding:5px 8px;border-radius:9px;font-size:10px}

    .hero{min-height:570px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:35px 16px 90px}.hero-logo{display:flex;align-items:center;gap:15px;color:#202123;font-size:38px;font-weight:780;letter-spacing:-1.5px;margin-bottom:28px}.cluster-logo{width:66px;height:66px;display:grid;place-items:center;border:1px solid #d8d8dc;border-radius:16px;background:linear-gradient(145deg,#fff,#f2f2f3);box-shadow:0 10px 28px rgba(0,0,0,.08)}.cluster-logo svg{width:52px;height:52px}.cluster-logo .links{fill:none;stroke:#777982;stroke-width:2;stroke-linecap:round}.cluster-logo .node{fill:#fff;stroke:#343541;stroke-width:2}.cluster-logo .node-core{fill:#202123;stroke:#202123;stroke-width:2}
    .search-shell{width:min(580px,92vw);position:relative;z-index:10;transition:transform .18s ease}.search-shell:hover,.search-shell:focus-within{transform:translateY(-1px)}.hero-search{width:100%;position:relative}.hero-search input{height:48px;padding:0 52px 0 17px;border-radius:10px;font-size:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.02)}.hero-search input:hover{border-color:#a7a7ac;box-shadow:0 7px 22px rgba(0,0,0,.08)}.hero-search input:focus{border-color:#74747b;box-shadow:0 9px 28px rgba(0,0,0,.10),0 0 0 1px rgba(32,33,35,.08)}.hero-search .search-btn{width:36px;height:36px;right:6px;top:6px;border-radius:8px}.hero-search .search-btn svg{width:18px;height:18px}.hero-note{margin-top:14px;color:#777982;font-size:12px}.hero-note strong{color:#343541;font-weight:600}
    .feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:610px;max-width:92vw;margin-top:30px}.feature{min-height:126px;border:1px solid #dedee1;border-radius:10px;padding:18px 14px 15px;text-align:center;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease,border-color .2s ease,background .2s ease}.feature strong{display:block;color:#343541;font-size:11px;margin-top:11px;letter-spacing:.1px}.feature-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:13px;background:#f7f7f8;border:1px solid #e5e5e7;transition:transform .22s cubic-bezier(.2,.8,.2,1),background .2s ease,border-color .2s ease}.feature-icon svg{width:37px;height:37px;fill:none;stroke:#343541;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.feature:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:#c5c5c9;background:#fdfdfd}.feature:hover .feature-icon{transform:translateY(-3px) scale(1.07) rotate(-1deg);background:#fff;border-color:#c8c8cc}.feature:nth-child(2):hover .feature-icon{transform:translateY(-3px) scale(1.07) translateX(2px)}.feature:nth-child(4):hover .feature-icon{transform:translateY(-4px) scale(1.06)}.feature:nth-child(5):hover .feature-icon{transform:translateY(-3px) scale(1.08) rotate(3deg)}.feature:nth-child(6):hover .feature-icon{transform:translateY(-3px) scale(1.08) rotate(-3deg)}

    .suggestions{position:absolute;left:0;right:0;top:56px;background:#fff;border:1px solid #d6d6da;border-radius:10px;box-shadow:0 18px 45px rgba(0,0,0,.13);padding:6px;overflow:hidden}.suggesting .hero-search input{border-color:#9e9ea4;box-shadow:0 9px 28px rgba(0,0,0,.10)}.suggestion-item{display:flex;align-items:center;gap:11px;padding:10px;border-radius:7px;color:#343541;transition:background .13s ease}.suggestion-item:hover{background:#f4f4f5}.suggestion-mark{width:34px;height:34px;border:1px solid #d8d8dc;background:#f7f7f8;border-radius:8px;display:grid;place-items:center;font-size:9px;font-weight:800;color:#565861;flex:0 0 auto}.suggestion-copy{min-width:0;display:flex;flex-direction:column;text-align:left}.suggestion-copy strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.suggestion-copy small{font-size:10px;color:#8a8a91;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    @media(max-width:760px){.nav-links a:not(.account-btn),.grid-btn{display:none}.nav{gap:10px}.brand{font-size:17px}.nav-search{max-width:none}.page{padding-left:10px;padding-right:10px}.metric-grid{grid-template-columns:repeat(2,1fr)}.filters .advanced{margin-left:0}.stats-row{flex-wrap:wrap;gap:8px}.mini-stat{border:0}.profile-head{flex-direction:column}.barrow{grid-template-columns:120px 1fr 40px}.feature-grid{grid-template-columns:repeat(2,1fr);width:min(430px,92vw)}.feature{min-height:118px}.subnav{gap:8px;overflow:auto}.profile-title{font-size:21px}.hero-logo{font-size:30px}.cluster-logo{width:58px;height:58px}.cluster-logo svg{width:45px;height:45px}}
    @media(max-width:440px){.feature-grid{grid-template-columns:1fr 1fr;gap:9px}.feature{padding:14px 8px}.hero-note{text-align:center;max-width:320px}.hero{justify-content:flex-start;padding-top:95px}}
  </style>
</head>
<body>
<div class="topline"></div>
{% block nav %}
<header class="nav">
  <a class="brand" href="/data"><span class="brand-mark">IC</span><span>IntellCluster</span></a>
  {% if active != 'home' %}
  <form class="nav-search" action="/data/search" method="get"><input name="q" value="{{ q|default('') }}" placeholder="Find a company, product or HS code"><button class="search-btn" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg></button></form>
  {% endif %}
  <nav class="nav-links"><a href="/about">About</a><a href="/contact">Contact</a><span class="grid-btn">▦</span><a class="account-btn" href="/account">My Account⌄</a></nav>
</header>
{% endblock %}
{% block body %}{% endblock %}
</body>
</html>
