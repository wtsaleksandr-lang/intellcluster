<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}IntellCluster Data{% endblock %}</title>
  <meta name="description" content="{% block meta_desc %}Search public business intelligence across companies, imports and government datasets.{% endblock %}">
  <style>
    :root {
      --ink:#06485c; --ink2:#0a5f76; --cyan:#1fc4ea; --cyan2:#42d0ef;
      --text:#123846; --muted:#6d8b96; --line:#d9e5e9; --soft:#f5f9fa;
      --white:#fff; --gold:#f4c916; --green:#3eb86b;
    }
    *{box-sizing:border-box} html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:13px}
    a{color:#1685ff;text-decoration:none} a:hover{text-decoration:underline}
    .topline{height:4px;background:#2b2b2b}.nav{height:62px;display:flex;align-items:center;max-width:1100px;margin:auto;padding:0 18px;gap:22px}
    .brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:800;font-size:21px;letter-spacing:-.4px}.brand-mark{width:30px;height:30px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--cyan)}
    .nav-search{flex:1;max-width:390px;position:relative}.nav-search input,.hero-search input{width:100%;border:1px solid #cfe0e6;border-radius:22px;outline:none;color:#365b68;background:#fff}.nav-search input{height:36px;padding:0 44px 0 16px}.search-btn{position:absolute;right:4px;top:4px;width:28px;height:28px;border:0;border-radius:50%;background:var(--cyan);color:#fff;font-size:15px;cursor:pointer}
    .nav-links{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:12px}.grid-btn{font-size:18px;color:var(--ink)}.account-btn{border:1px solid #ec2185;color:#d71976;border-radius:8px;padding:10px 16px;background:#fff}
    .page{max-width:1030px;margin:0 auto;padding:0 18px 60px}.wide{max-width:1110px}.subnav{height:45px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:30px;margin-bottom:14px}.subnav a{color:#788f9b;padding:0 8px 12px;font-size:12px}.subnav a.active{color:var(--ink);font-weight:700;border-bottom:2px solid var(--ink)}
    .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.filter{height:38px;border:1px solid #cbdce2;border-radius:8px;background:#fff;color:#35606d;padding:0 34px 0 12px;min-width:120px}.filters .advanced{margin-left:auto;font-weight:700;color:var(--ink)}
    .result-meta{color:#7f969f;font-size:11px;margin:12px 0}.cards{display:flex;flex-direction:column;gap:10px}.card{border:1px solid #cfdee3;border-radius:7px;background:#fff;display:flex;overflow:hidden;min-height:94px}.card-accent{width:8px;background:var(--cyan)}.card.supplier .card-accent{background:#2d7487}.card-body{padding:12px 14px;flex:1}.card-title{font-size:16px;font-weight:700;color:#1881ff;margin-bottom:7px;display:flex;align-items:center;gap:8px}.badge{font-size:9px;font-weight:700;border-radius:10px;background:var(--cyan);color:#fff;padding:3px 7px}.badge.dark{background:#2e7183}.badge.green{background:var(--green)}.card-address{font-size:11px;color:#345a67;margin-bottom:9px}.stats-row{display:flex;gap:0}.mini-stat{min-width:115px;padding-right:18px;margin-right:18px;border-right:1px solid #dbe6ea}.mini-stat:last-child{border-right:0}.mini-label{font-size:9px;color:#83a0aa;margin-bottom:3px}.mini-value{font-size:11px;color:#083d4d;font-weight:600}
    .notice{font-size:11px;background:#fff8dc;border:1px solid #f2d777;padding:9px 12px;border-radius:6px;color:#765f00;margin:10px 0 14px}
    .profile-box{border:1px solid #cfdee3;border-radius:10px;margin-top:10px;background:#fff;overflow:hidden}.profile-head{display:flex;justify-content:space-between;gap:20px;padding:17px 18px 12px;border-bottom:1px solid var(--line)}.profile-title{font-size:25px;color:#063f50;font-weight:800;letter-spacing:-.7px}.profile-meta{padding:12px 18px 14px;line-height:1.7;font-size:11px}.profile-actions{display:flex;gap:8px;align-items:flex-start}.small-btn{border:1px solid #cfdde2;background:#fff;border-radius:7px;padding:8px 11px;color:#476674}.source-line{border-top:1px solid var(--line);padding:10px 18px;color:#6e909b;font-size:9px}
    .metric-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:17px 0}.metric{border:1px solid #cfdee3;border-radius:9px;padding:12px 13px;background:#fff}.metric-label{font-size:9px;color:#748f99}.metric-value{font-size:15px;color:#073d4d;margin-top:4px;font-weight:700}
    .section{margin:24px 0}.section h2{font-size:18px;color:#06485c;margin:0 0 13px}.data-table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #cfdee3;border-radius:7px;overflow:hidden;font-size:11px}.data-table th{background:#f5f8fa;color:#66858f;text-align:left;font-size:9px;padding:9px;border-bottom:1px solid #dbe5e9}.data-table td{padding:10px 9px;border-bottom:1px solid #e4ecef;vertical-align:top}.data-table tr:nth-child(even) td{background:#f7fafb}.data-table tr:last-child td{border-bottom:0}
    .barlist{display:flex;flex-direction:column;gap:9px}.barrow{display:grid;grid-template-columns:220px 1fr 55px;gap:12px;align-items:center;font-size:11px}.bar{height:14px;background:#e9f0f3;border-radius:2px;overflow:hidden}.bar > span{display:block;height:100%;background:#07566c}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#eef6f8;border:1px solid #d2e3e8;color:#32616f;padding:5px 8px;border-radius:12px;font-size:10px}
    .hero{min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:80px}.hero-logo{display:flex;align-items:center;gap:13px;color:var(--ink);font-size:42px;font-weight:900;letter-spacing:-1.5px;margin-bottom:25px}.hero-logo .brand-mark{width:68px;height:68px;font-size:25px;border-width:5px}.hero-logo span em{font-style:normal;color:var(--cyan)}.hero-search{width:min(540px,90vw);position:relative}.hero-search input{height:38px;padding:0 46px 0 16px}.hero-search .search-btn{width:30px;height:30px}.hero-note{margin-top:13px;color:#06485c;font-size:13px}.hero-note strong{color:var(--cyan);font-weight:500}.random{margin-top:26px;border:1px solid #d4e0e4;background:#fff;border-radius:3px;padding:8px 16px;color:#2d6676;font-size:11px}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:460px;max-width:90vw;margin-top:25px}.feature{border:1px solid #d9e4e8;border-radius:7px;padding:12px;text-align:center}.feature strong{display:block;color:#0c4e60;font-size:11px;margin-top:5px}.feature span{font-size:20px;color:var(--cyan)}
    @media(max-width:760px){.nav-links a:not(.account-btn),.grid-btn{display:none}.nav{gap:10px}.brand{font-size:17px}.nav-search{max-width:none}.page{padding-left:10px;padding-right:10px}.metric-grid{grid-template-columns:repeat(2,1fr)}.filters .advanced{margin-left:0}.stats-row{flex-wrap:wrap;gap:8px}.mini-stat{border:0}.profile-head{flex-direction:column}.barrow{grid-template-columns:120px 1fr 40px}.feature-grid{grid-template-columns:1fr}.subnav{gap:8px;overflow:auto}.profile-title{font-size:21px}}
  </style>
</head>
<body>
<div class="topline"></div>
{% block nav %}
<header class="nav">
  <a class="brand" href="/data"><span class="brand-mark">IC</span><span>IntellCluster</span></a>
  {% if active != 'home' %}
  <form class="nav-search" action="/data/search" method="get"><input name="q" value="{{ q|default('') }}" placeholder="Find a company, product or HS code"><button class="search-btn" aria-label="Search">⌕</button></form>
  {% endif %}
  <nav class="nav-links"><a href="/about">About</a><a href="/contact">Contact</a><span class="grid-btn">▦</span><a class="account-btn" href="/account">My Account⌄</a></nav>
</header>
{% endblock %}
{% block body %}{% endblock %}
</body>
</html>
