name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test
        env:
          ADMIN_USERNAME: smoke
          ADMIN_PASSWORD: smoke-test-pw
          ADMIN_SECRET_KEY: smoke-ci-random-value-7fd2a9c6810b
          INTELLIGENCE_DB_PATH: /tmp/intelligence-ci.db
        run: |
          python -m tests.smoke
          python -m tests.intelligence_unit
          python -m tests.intelligence_persistence
          INTELLIGENCE_ALLOW_LEGACY_DEMO_PROFILE=1 python -m tests.intelligence_ui
          python -m tests.intelligence_compliance_export
          python -m tests.fmcsa_fast_seed
          python -m tests.intelligence_api
          python -m tests.sec_edgar
          python -m tests.evidence_sitemap
          python -m tests.search_empty_state
          python -m tests.search_us_signals
          python -m tests.importyeti_cost_guard
          python -m tests.sync_observability
          python -m tests.post_ingest_readiness

  lint:
    name: Lint intelligence changes
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run correctness lint on new intelligence layer
        run: ruff check intelligence main_data.py tests/intelligence_unit.py tests/intelligence_persistence.py tests/intelligence_ui.py tests/intelligence_compliance_export.py tests/fmcsa_fast_seed.py tests/intelligence_api.py tests/sec_edgar.py tests/evidence_sitemap.py tests/search_empty_state.py tests/search_us_signals.py tests/importyeti_cost_guard.py tests/sync_observability.py tests/post_ingest_readiness.py --select F,E4,E7,E9 --output-format=github