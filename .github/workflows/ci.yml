name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test
        env:
          ADMIN_USERNAME: smoke
          ADMIN_PASSWORD: smoke-test-pw
          ADMIN_SECRET_KEY: smoke-ci-random-value-7fd2a9c6810b
          INTELLIGENCE_DB_PATH: /tmp/intelligence-ci.db
        run: |
          python -m tests.smoke
          python -m tests.intelligence_unit
          python -m tests.intelligence_persistence
          python -m tests.intelligence_ui
          python -m tests.intelligence_compliance_export
          python -m tests.intelligence_api

  lint:
    name: Lint intelligence changes
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run correctness lint on new intelligence layer
        run: ruff check intelligence main_data.py tests/intelligence_unit.py tests/intelligence_persistence.py tests/intelligence_ui.py tests/intelligence_compliance_export.py tests/intelligence_api.py --select F,E4,E7,E9 --output-format=github
